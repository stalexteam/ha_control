<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan Studio dev</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1220; }
    #bar { position: fixed; right: 8px; bottom: 36px; z-index: 100; display: flex; gap: 6px;
      font: 12px system-ui, sans-serif; background: rgba(15, 23, 42, .9); color: #cbd5e1;
      padding: 6px 8px; border-radius: 6px; border: 1px solid #334155; }
    #bar button, #bar select { font: inherit; }
  </style>
</head>
<body>
  <div id="bar">
    <label><input type="checkbox" id="dark" checked /> dark</label>
    <button id="foreign" title="Bump stored revision as if another tab saved">foreign save</button>
    <button id="wipe" title="Delete stored plans">delete stored</button>
  </div>
  <plan-studio-panel id="panel"></plan-studio-panel>
  <script type="module">
    import '../src/panel/plan-studio-panel.ts';
    import { createMockHass, simulateForeignSave, clearPlans, STORAGE_KEY } from './mock-hass.ts';
    import { memoryStorage } from './memory-storage.ts';
    import { SCENES } from './scenes.ts';
    import { html, render } from 'lit';
    import { renderPower } from '../src/render/power-svg.ts';
    import { paletteFor } from '../src/render/theme.ts';
    import { schemaBounds } from '../src/geometry/power.ts';
    import { migrateDevices } from '../src/model/migrate-devices.ts';
    import { normalizePower } from '../src/model/power.ts';

    const params = new URLSearchParams(location.search);
    const dark = params.get('dark') !== '0';
    document.getElementById('dark').checked = dark;
    document.body.style.background = dark ? '#0b1220' : '#f3efe8';

    const panel = document.getElementById('panel');
    // scene=<name>: seed an in-memory store from SCENES (localStorage stays untouched).
    const scene = SCENES[params.get('scene') ?? ''];
    const plans = scene ? Object.fromEntries(scene.plans.map(p => [p.id, p])) : null;
    const step = params.get('step'), select = params.get('select');
    const selection = select ? { kind: select.slice(0, select.indexOf(':')), id: select.slice(select.indexOf(':') + 1) } : null;

    if (params.get('render') === 'power') {
      // render=power: the scene's schematic and frame drawn by renderPower full-screen (no panel), at 100 % or
      // zoom=<screen px per unit>; a schematic larger than the window is fitted. The plan goes through the same
      // migrateDevices and normalizePower as in the panel, so both show the same schematic.
      panel.remove();
      const plan = scene?.plans[0];
      const doc = plan ? migrateDevices({ level: plan.levels[0], power: plan.power }) : null;
      const devices = doc?.level.devices ?? [];
      const geo = { device: id => devices.find(d => d.id === id) };
      const schema = (doc && normalizePower(doc.power, geo)) ?? { blocks: [], wires: [] };
      const b = schemaBounds(schema, geo) ?? { x: 0, y: 0, w: 0, h: 0 };
      const W = innerWidth, H = innerHeight;
      const scale = Number(params.get('zoom')) || Math.min(1, (W - 80) / Math.max(b.w, 1), (H - 80) / Math.max(b.h, 1));
      const vw = W / scale, vh = H / scale;
      const box = `${b.x + b.w / 2 - vw / 2} ${b.y + b.h / 2 - vh / 2} ${vw} ${vh}`;
      const host = document.createElement('div');
      document.body.appendChild(host);
      render(html`<svg id="power" xmlns="http://www.w3.org/2000/svg" width=${W} height=${H} viewBox=${box}
        style="display:block">${renderPower(schema, {
          palette: paletteFor(dark), selection, preview: {}, scale, frame: scene?.powerFrame ?? null, geo,
        })}</svg>`, host);
    } else {
      panel.hass = createMockHass({
        darkMode: dark, demo: true,
        ...(scene ? { storage: memoryStorage({ [STORAGE_KEY]: JSON.stringify({ plans }) }), powerFrame: scene.powerFrame, rulesFrame: scene.rulesFrame } : {}),
      });
    }

    // step=<EditorMode>, tool=<ToolId> (zone=polygon: the Zone tool's method) and select=<kind>:<id>: applied once
    // the panel has loaded its plan.
    const tool = params.get('tool'), zoneMethod = params.get('zone');
    if (params.get('render') !== 'power' && (step || select || tool)) {
      const timer = setInterval(() => {
        if (!panel.plan) return;
        clearInterval(timer);
        if (step) panel.setMode(step);
        if (zoneMethod) panel.nextObj = { ...panel.nextObj, zone: { ...panel.nextObj.zone, method: zoneMethod } };
        if (tool) panel.pickTool(tool);
        if (selection) panel.selection = selection;
      }, 50);
    }

    const reload = () => {
      params.set('dark', document.getElementById('dark').checked ? '1' : '0');
      location.search = params.toString();
    };
    document.getElementById('dark').addEventListener('change', reload);
    document.getElementById('foreign').addEventListener('click', () => simulateForeignSave());
    document.getElementById('wipe').addEventListener('click', () => clearPlans());
  </script>
</body>
</html>
