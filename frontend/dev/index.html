<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plan Studio dev</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b1220; }
    #bar { position: fixed; right: 8px; bottom: 36px; z-index: 100; display: flex; gap: 6px;
      font: 12px system-ui, sans-serif; background: rgba(15, 23, 42, .9); color: #cbd5e1;
      padding: 6px 8px; border-radius: 6px; border: 1px solid #334155; }
    #bar button, #bar select { font: inherit; }
  </style>
</head>
<body>
  <div id="bar">
    <label><input type="checkbox" id="dark" checked /> dark</label>
    <button id="foreign" title="Bump stored revision as if another tab saved">foreign save</button>
    <button id="wipe" title="Delete stored plans">delete stored</button>
  </div>
  <plan-studio-panel id="panel"></plan-studio-panel>
  <script type="module">
    import '../src/panel/plan-studio-panel.ts';
    import { createMockHass, simulateForeignSave, clearPlans, STORAGE_KEY } from './mock-hass.ts';
    import { memoryStorage } from './memory-storage.ts';
    import { SCENES } from './scenes.ts';

    const params = new URLSearchParams(location.search);
    const dark = params.get('dark') !== '0';
    document.getElementById('dark').checked = dark;
    document.body.style.background = dark ? '#0b1220' : '#f3efe8';

    const panel = document.getElementById('panel');
    // scene=<name>: seed an in-memory store from SCENES (localStorage stays untouched).
    const scene = SCENES[params.get('scene') ?? ''];
    const plans = scene ? Object.fromEntries(scene.plans.map(p => [p.id, p])) : null;
    panel.hass = createMockHass({
      darkMode: dark, demo: true,
      ...(scene ? { storage: memoryStorage({ [STORAGE_KEY]: JSON.stringify({ plans }) }), powerFrame: scene.powerFrame } : {}),
    });

    // step=<EditorMode> and select=<kind>:<id>: applied once the panel has loaded its plan.
    const step = params.get('step'), select = params.get('select');
    if (step || select) {
      const timer = setInterval(() => {
        if (!panel.plan) return;
        clearInterval(timer);
        if (step) panel.setMode(step);
        if (select) {
          const i = select.indexOf(':');
          panel.selection = { kind: select.slice(0, i), id: select.slice(i + 1) };
        }
      }, 50);
    }

    const reload = () => {
      params.set('dark', document.getElementById('dark').checked ? '1' : '0');
      location.search = params.toString();
    };
    document.getElementById('dark').addEventListener('change', reload);
    document.getElementById('foreign').addEventListener('click', () => simulateForeignSave());
    document.getElementById('wipe').addEventListener('click', () => clearPlans());
  </script>
</body>
</html>
